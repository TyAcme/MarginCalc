  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #e9edf3;
      --surface: #ffffff;
      --border: #d0d6e0;
      --text: #1a1f2e;
      --text-muted: #6b7585;
      --accent: #2563eb;
      --accent-light: #eff4ff;
      --section-bg: #f5f5f5;   /* consistent light grey for all sections */
      --vendor-section-bg: #fafafa; /* lighter grey for vendor rows */
      --radius: 12px;
      --shadow: 0 1px 4px rgba(0,0,0,0.08), 0 4px 16px rgba(0,0,0,0.06);

      /* Field states */
      --field-default-bg: #efefef;
      --field-locked-bg: #fdf8e1;
      --field-locked-border: #e8d97a;
      --field-calc-bg: #fff8e6;
      --field-calc-border: #f0c869;

      /* Header bubble */
      --header-bg: #8b1a1a;   /* deep red */

      font-size: 20px; /* +2pt larger than previous 17.6px */
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans", "Segoe UI", Arial, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px 40px;
    }

    /* ── Card wraps header + body together ── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 378px;
      overflow: hidden;
    }

    /* ── Mode dropdown in header — now top of card ── */
    .page-header {
      width: 100%;
      background: #8b1a1a;
      color: #fff;
      font-weight: 700;
      font-size: 0.92rem;
      letter-spacing: 0.02em;
      padding: 7px 14px;
      border-radius: 0;
      margin-bottom: 0;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      transition: background 0.25s;
    }
    .page-header.mode-direct {
      background: #1e4d7a;
    }
    /* ── Custom mode dropdown ── */
    .custom-select {
      position: relative;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
    }
    .custom-select-selected {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      border: 1.5px solid rgba(255,255,255,0.4);
      color: #8b1a1a;
      padding: 3px 10px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .custom-select-selected:hover { background: #dde1e8; }
    .mode-direct .custom-select-selected { color: #1e4d7a; }
    .custom-select-options {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      min-width: 100%;
      border-radius: 7px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      z-index: 100;
    }
    .custom-select-options.open { display: block; }
    .custom-select-option {
      padding: 9px 16px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      background: #e9edf3;
      transition: background 0.12s;
    }
    .custom-select-option[data-value="disty"] { color: #8b1a1a; }
    .custom-select-option[data-value="direct"] { color: #1e4d7a; }
    .custom-select-option.selected { background: #e9edf3; }
    .custom-select-option:hover { background: #ffffff; }
    .custom-select-option:not(:hover) { background: #e9edf3; }

    /* ── Profits divider — slightly bolder to separate profit rows ── */
    .profits-divider {
      height: 2px;
      background: #b0b8c8;
      margin: 0;
    }

    /* ── Section groups — horizontal padding only; rows own vertical space ── */
    .section-group {
      background: var(--section-bg);
      padding: 0 9px;
    }
    .section-group.vendor-group {
      background: var(--vendor-section-bg);
    }

    /* Divider sits flush; vertical rhythm is purely from row padding */
    .section-divider {
      height: 1px;
      background: var(--border);
    }

    /* ── Rows — uniform vertical spacing ── */
    .row {
      display: grid;
      /* label | symbol | input | clear | lock */
      grid-template-columns: 120px 12px 1fr 23px 27px;
      align-items: center;
      gap: 3px;
      padding: 6px 2px; /* equal top & bottom on every row */
    }

    .row-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      text-align: right;
      padding-right: 3px;
    }

    /* ── Symbol column ($  %) — matches label font/color ── */
    .sym {
      font-size: 0.8rem;
      color: var(--text);
      font-weight: 700;
      user-select: none;
      text-align: center;
      flex-shrink: 0;
    }
    .is-calc-sym   { font-weight: 700; color: var(--text); }
    .is-locked-sym { font-weight: 700; color: var(--text); }

    /* ── Input wrap ── */
    .input-wrap {
      display: flex;
      align-items: center;
      background: var(--field-default-bg);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 4px 6px;
      transition: border-color 0.15s, background 0.15s;
      min-width: 0;
      margin-left: 4px;
    }
    .input-wrap:focus-within {
      border-color: var(--accent);
      background: var(--accent-light);
    }
    .input-wrap.is-locked {
      background: #d4d7db !important;
      border-color: #6b7280 !important;
      border-width: 2px !important;
    }
    .input-wrap.is-calc {
      background: var(--field-calc-bg);
      border-color: var(--field-calc-border);
    }
    .input-wrap.is-calc:focus-within {
      border-color: #f0c869;
      background: #fff3cc;
    }

    .input-wrap input {
      border: none;
      background: none;
      outline: none;
      font-size: 0.82rem;
      font-weight: 400;
      color: var(--text);
      width: 100%;
      min-width: 0;
      font-family: inherit;
    }
    .input-wrap.is-calc input,
    .input-wrap.is-locked input {
      font-weight: 700;
    }
    /* hide spinners */
    .input-wrap input::-webkit-inner-spin-button,
    .input-wrap input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .input-wrap input[type=number] { -moz-appearance: textfield; }

    /* ── Clear (×) button ── */
    .clear-btn {
      width: 20px;
      height: 20px;
      border: none;
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: #bbb;
      font-size: 0.9rem;
      line-height: 1;
      flex-shrink: 0;
      font-family: inherit;
      transition: background 0.12s, color 0.12s;
    }
    .clear-btn:hover { background: #ddd; color: #555; }

    /* ── Lock button ── */
    .lock-btn {
      width: 25px;
      height: 25px;
      border: none;
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      font-size: 0.9rem;
      font-family: inherit;
      transition: background 0.15s, filter 0.15s;
      flex-shrink: 0;
      /* Unlocked: green tint */
      filter: hue-rotate(100deg) saturate(1.5) brightness(0.7);
    }
    .lock-btn:hover { background: rgba(0,0,0,0.07); }
    /* Locked: desaturate to grey */
    .lock-btn.is-locked {
      filter: grayscale(1) brightness(0.6);
    }

    /* ── Vendor Profit field — always light green ── */
    #wrap_vendorProfit {
      background: #eaf5ee !important;
      border-color: #7ec89a !important;
    }
    #wrap_vendorProfit:focus-within {
      background: #d6eedd !important;
      border-color: #4cae6a !important;
    }

    /* ── Panels ── */
    .profits-panel { display: none; }
    .pricing-panel { display: block; }

    /* ── Actions ── */
    .actions {
      display: flex;
      gap: 8px;
      padding: 8px 11px 10px;
      background: #fafafa;
    }
    .btn {
      flex: 1;
      padding: 8px;
      border-radius: 7px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: background 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #e2e6ed; color: var(--text-muted); }
    .btn-secondary:hover { background: #d0d6e0; }
    .btn-clear-inactive { background: #c8dfee; color: #6a9ab5; cursor: default; }
    .btn-clear-active { background: #2d6a8f; color: #fff; }
    .btn-clear-active:hover { background: #245a7a; }
    .btn-copy-inactive { background: #c8e6d6; color: #6aaa8a; cursor: default; }
    .btn-copy-active { background: #2d7a4f; color: #fff; }
    .btn-copy-active:hover { background: #246040; }

    /* ── Error field state ── */
    .input-wrap.is-error {
      border-color: #e05555 !important;
      border-width: 2px !important;
      background: #fff5f5 !important;
    }
    .clear-btn.is-error {
      color: #e05555;
      font-size: 1.1rem;
      font-weight: 900;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #1a1f2e;
      color: #fff;
      padding: 11px 22px;
      border-radius: 22px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
      font-family: inherit;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Mobile responsive ── */
    @media (max-width: 480px) {
      :root { font-size: 13px; }

      body {
        padding: 12px 8px calc(env(safe-area-inset-bottom) + 24px);
      }

      .page-header {
        font-size: 0.85rem;
        padding: 7px 12px;
        margin-bottom: 10px;
        border-radius: 7px;
      }

      .card {
        border-radius: 8px;
        max-width: 100%;
      }

      .tabs {
        gap: 6px;
        padding: 8px 10px 7px;
      }
      .tab {
        font-size: 0.78rem;
        padding: 7px 0;
        min-height: 36px;
      }

      .section-group { padding: 0 8px; }

      .row {
        grid-template-columns: 100px 14px 1fr 28px 30px;
        gap: 3px;
        padding: 6px 0;
      }

      .row-label { font-size: 0.75rem; }
      .sym { font-size: 0.75rem; }

      .input-wrap {
        padding: 5px 5px;
      }

      .input-wrap input {
        font-size: max(16px, 0.78rem);
      }

      .clear-btn { width: 28px; height: 28px; font-size: 1rem; }
      .lock-btn  { width: 30px; height: 30px; font-size: 1rem; }

      .actions {
        gap: 7px;
        padding: 8px 10px calc(env(safe-area-inset-bottom) + 10px);
      }

      .btn { padding: 10px; font-size: 0.78rem; min-height: 38px; }

      .toast {
        font-size: 0.78rem;
        padding: 8px 16px;
        bottom: calc(env(safe-area-inset-bottom) + 16px);
      }
    }

    @media (max-width: 340px) {
      .row { grid-template-columns: 88px 13px 1fr 26px 28px; }
      .row-label { font-size: 0.7rem; }
    }
  </style>
</head>
<body>

<div class="card">

<div class="page-header">
  <span>Margin Calculator</span>
  <div class="custom-select" id="customSelect">
    <div class="custom-select-selected" id="customSelectSelected" onclick="toggleDropdown()">
      <span id="customSelectText">Disty</span>
      <svg width="10" height="7" viewBox="0 0 10 7" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
    <div class="custom-select-options" id="customSelectOptions">
      <div class="custom-select-option selected" data-value="disty" onclick="selectMode('disty')">Disty</div>
      <div class="custom-select-option" data-value="direct" onclick="selectMode('direct')">Direct</div>
    </div>
  </div>
</div>

  <!-- ══ SINGLE PANEL ══ -->
  <div id="mainPanel">

    <!-- Vendor section -->
    <div class="section-group vendor-group">
      <div class="row">
        <span class="row-label">Vendor Cost</span>
        <span class="sym" id="sym_vendorCost">$</span>
        <div class="input-wrap" id="wrap_vendorCost">
          <input type="text" inputmode="decimal" id="vendorCost" placeholder="0.00" maxlength="12"
            oninput="onUserInput('vendorCost')"
            onfocus="onFocus('vendorCost')"
            onblur="onBlur('vendorCost')"
            onkeydown="trapTab(event,'vendorCost')" />
        </div>
        <button class="clear-btn" tabindex="-1" onmousedown="event.preventDefault()" onclick="clearField('vendorCost')" title="Clear">×</button>
        <button class="lock-btn" onmousedown="event.preventDefault()" id="lock_vendorCost" tabindex="-1" onclick="toggleLock('vendorCost')" title="Lock field">🔓</button>
      </div>
      <div class="row">
        <span class="row-label" >Vendor Margin</span>
        <span class="sym" id="sym_vendorMargin" >%</span>
        <div class="input-wrap" id="wrap_vendorMargin">
          <input type="number" id="vendorMargin" min="0" max="99.99" step="0.01" placeholder="0.00"
            
            oninput="onUserInput('vendorMargin')"
            onfocus="focusedField='vendorMargin'; setTimeout(()=>this.select(),0)"
            onblur="onBlurNumber('vendorMargin')"
            onkeydown="trapTab(event,'vendorMargin')" />
        </div>
        <button class="clear-btn" tabindex="-1" onmousedown="event.preventDefault()" onclick="clearField('vendorMargin')" title="Clear">×</button>
        <button class="lock-btn" onmousedown="event.preventDefault()" id="lock_vendorMargin" tabindex="-1" onclick="toggleLock('vendorMargin')" title="Lock field">🔓</button>
      </div>
    </div>

    <!-- Disty section (hidden in Direct mode) -->
    <div class="section-divider" id="divider-disty"></div>
    <div class="section-group vendor-group" id="section-disty">
      <div class="row">
        <span class="row-label">Disty Price</span>
        <span class="sym" id="sym_distyPrice">$</span>
        <div class="input-wrap" id="wrap_distyPrice">
          <input type="text" inputmode="decimal" id="distyPrice" placeholder="0.00" maxlength="12"
            oninput="onUserInput('distyPrice')"
            onfocus="onFocus('distyPrice')"
            onblur="onBlur('distyPrice')"
            onkeydown="trapTab(event,'distyPrice')" />
        </div>
        <button class="clear-btn" tabindex="-1" onmousedown="event.preventDefault()" onclick="clearField('distyPrice')" title="Clear">×</button>
        <button class="lock-btn" onmousedown="event.preventDefault()" id="lock_distyPrice" tabindex="-1" onclick="toggleLock('distyPrice')" title="Lock field">🔓</button>
      </div>
      <div class="row">
        <span class="row-label" >Disty Margin</span>
        <span class="sym" id="sym_distyMargin" >%</span>
        <div class="input-wrap" id="wrap_distyMargin">
          <input type="number" id="distyMargin" min="0" max="99.99" step="0.01" placeholder="0.00"
            
            oninput="onUserInput('distyMargin')"
            onfocus="focusedField='distyMargin'; setTimeout(()=>this.select(),0)"
            onblur="onBlurNumber('distyMargin')"
            onkeydown="trapTab(event,'distyMargin')" />
        </div>
        <button class="clear-btn" tabindex="-1" onmousedown="event.preventDefault()" onclick="clearField('distyMargin')" title="Clear">×</button>
        <button class="lock-btn" onmousedown="event.preventDefault()" id="lock_distyMargin" tabindex="-1" onclick="toggleLock('distyMargin')" title="Lock field">🔓</button>
      </div>
    </div>

    <!-- Reseller section -->
    <div class="section-divider" id="divider-reseller"></div>
    <div class="section-group vendor-group" id="section-reseller">
      <div class="row">
        <span class="row-label">Reseller Price</span>
        <span class="sym" id="sym_resellerPrice">$</span>
        <div class="input-wrap" id="wrap_resellerPrice">
          <input type="text" inputmode="decimal" id="resellerPrice" placeholder="0.00" maxlength="12"
            oninput="onUserInput('resellerPrice')"
            onfocus="onFocus('resellerPrice')"
            onblur="onBlur('resellerPrice')"
            onkeydown="trapTab(event,'resellerPrice')" />
        </div>
        <button class="clear-btn" tabindex="-1" onmousedown="event.preventDefault()" onclick="clearField('resellerPrice')" title="Clear">×</button>
        <button class="lock-btn" onmousedown="event.preventDefault()" id="lock_resellerPrice" tabindex="-1" onclick="toggleLock('resellerPrice')" title="Lock field">🔓</button>
      </div>
    </div>

    <!-- Profits divider -->
    <div class="section-divider"></div>

    <!-- Vendor Profit — read-only calculated field -->
    <div class="section-group vendor-group">
      <div class="row" style="grid-template-columns: 120px 12px 1fr;">
        <span class="row-label" style="font-style:italic;">Vendor Profit</span>
        <span class="sym" id="sym_vendorProfit" style="font-style:italic;">$</span>
        <div class="input-wrap" id="wrap_vendorProfit">
          <input type="text" id="vendorProfit" placeholder="0.00" maxlength="12"
            style="font-style:italic;"
            readonly tabindex="-1" />
        </div>
      </div>
    </div>

  </div><!-- /mainPanel -->

  <div class="actions">
    <button class="btn btn-copy-inactive" id="copyBtn" onclick="handleCopy()">Copy Result</button>
    <button class="btn btn-clear-inactive" id="clearBtn" onclick="handleClear()">Clear All</button>
  </div>
</div>

<div class="toast" id="toast">Copied!</div>

<script>
  let currentMode = 'disty'; // 'disty' | 'direct'

  function updateClearBtn() {
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const allFields = ['vendorCost','vendorMargin','distyPrice','distyMargin','resellerPrice'];
    const hasData = allFields.some(id => {
      const el = document.getElementById(id);
      return el && el.value !== '';
    });
    if (hasData) {
      clearBtn.className = 'btn btn-clear-active';
      clearBtn.textContent = 'Clear All';
      copyBtn.className = 'btn btn-copy-active';
    } else {
      clearBtn.className = 'btn btn-clear-inactive';
      clearBtn.textContent = 'Clear All';
      copyBtn.className = 'btn btn-copy-inactive';
    }
  }

  function handleCopy() {
    const allFields = ['vendorCost','vendorMargin','distyPrice','distyMargin','resellerPrice'];
    const hasData = allFields.some(id => {
      const el = document.getElementById(id);
      return el && el.value !== '';
    });
    if (hasData) copyResult();
  }

  function handleClear() {
    const allFields = ['vendorCost','vendorMargin','distyPrice','distyMargin','resellerPrice'];
    const hasData = allFields.some(id => {
      const el = document.getElementById(id);
      return el && el.value !== '';
    });
    if (hasData) clearAll();
  }

  function toggleDropdown() {
    document.getElementById('customSelectOptions').classList.toggle('open');
  }

  function selectMode(value) {
    // Reset all options to grey, set selected to white
    document.querySelectorAll('.custom-select-option').forEach(opt => {
      opt.classList.remove('selected');
      if (opt.dataset.value === value) opt.classList.add('selected');
    });
    document.getElementById('customSelectText').textContent =
      value === 'disty' ? 'Disty' : 'Direct';
    document.getElementById('customSelectOptions').classList.remove('open');
    switchMode(value);
  }

  // Close dropdown when clicking outside
  document.addEventListener('click', e => {
    if (!document.getElementById('customSelect').contains(e.target)) {
      document.getElementById('customSelectOptions').classList.remove('open');
    }
  });

  function switchMode(mode) {
    currentMode = mode;
    clearAll();
    updateClearBtn();

    const header = document.querySelector('.page-header');
    header.classList.toggle('mode-direct', mode === 'direct');

    // Elements to hide/show in Direct mode
    const distyElements = [
      'divider-disty', 'section-disty',
      'divider-reseller'
    ];

    if (mode === 'direct') {
      distyElements.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
      });
    } else {
      distyElements.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = '';
      });
    }

    updateTabOrder();
  }

  function updateTabOrder() {
    if (currentMode === 'direct') {
      TAB_ORDER.length = 0;
      TAB_ORDER.push('vendorCost', 'vendorMargin', 'resellerPrice');
    } else {
      TAB_ORDER.length = 0;
      TAB_ORDER.push('vendorCost', 'vendorMargin', 'distyPrice', 'distyMargin', 'resellerPrice');
    }
  }
  const locked  = new Set();
  const userSet = new Set();
  const calcSet = new Set();

  const TAB_ORDER = ['vendorCost','vendorMargin','distyPrice','distyMargin','resellerPrice'];
  const dollarFields = new Set(['vendorCost','distyPrice','resellerPrice']);

  function trapTab(e, fieldId) {
    if (e.key !== 'Tab') return;
    e.preventDefault();
    const idx = TAB_ORDER.indexOf(fieldId);
    const len = TAB_ORDER.length;
    let next;
    // Step through fields skipping any that are locked
    let steps = 0;
    let i = idx;
    do {
      i = e.shiftKey ? (i - 1 + len) % len : (i + 1) % len;
      next = TAB_ORDER[i];
      steps++;
    } while (locked.has(next) && steps < len);
    document.getElementById(next).focus();
  }

  // Format number with commas; show cents only when value has them
  function fmtDollar(n) {
    if (n === null || !isFinite(n)) return '';
    const hasCents = (Math.round(n * 100) % 100) !== 0;
    return n.toLocaleString('en-US', {
      minimumFractionDigits: hasCents ? 2 : 0,
      maximumFractionDigits: 2
    });
  }

  // Parse a possibly-comma-formatted string to a float
  function parseVal(str) {
    const cleaned = str.replace(/,/g, '');
    const v = parseFloat(cleaned);
    return isNaN(v) ? null : v;
  }

  function val(id) {
    const el = document.getElementById(id);
    return dollarFields.has(id) ? parseVal(el.value) : (isNaN(parseFloat(el.value)) ? null : parseFloat(el.value));
  }

  function setCalc(id, v) {
    // vendorProfit is always writable (read-only display field)
    if (id !== 'vendorProfit' && (locked.has(id) || userSet.has(id))) return;
    if (v === null || !isFinite(v)) return;
    let rounded;
    if (dollarFields.has(id) || id === 'vendorProfit') {
      rounded = Math.round(v * 100) / 100;
      document.getElementById(id).value = fmtDollar(rounded);
    } else {
      rounded = Math.round(v * 100) / 100;
      document.getElementById(id).value = rounded;
    }
    calcSet.add(id);
    // Record which user field most recently triggered this calculation
    if (focusedField && focusedField !== id) {
      calcSource[id] = focusedField;
    } else if (userOrder.length > 0) {
      calcSource[id] = userOrder[userOrder.length - 1];
    }
    updateWrapStyle(id);
    updateClearBtn();
  }

  // On focus: strip commas so user can type freely; track focused field
  function onFocus(id) {
    focusedField = id;
    if (!dollarFields.has(id)) return;
    const el = document.getElementById(id);
    const n = parseVal(el.value);
    if (n !== null) el.value = n; // plain number, no commas
    setTimeout(() => el.select(), 0); // select all on focus
  }

  // On blur for dollar fields: reformat, and if empty remove from userSet
  function onBlur(id) {
    focusedField = null;
    if (!dollarFields.has(id)) return;
    const el = document.getElementById(id);
    const n = parseVal(el.value);
    if (n !== null) {
      el.value = fmtDollar(n);
    } else {
      // truly empty — release userSet ownership so other fields can recalc
      userSet.delete(id);
      calcSet.delete(id);
      updateWrapStyle(id);
      recalcAll();
    }
  }

  // On blur for number (margin) fields
  function onBlurNumber(id) {
    focusedField = null;
    const el = document.getElementById(id);
    if (el.value === '' || el.value === null) {
      userSet.delete(id);
      calcSet.delete(id);
      updateWrapStyle(id);
      recalcAll();
    }
  }

  function updateWrapStyle(id) {
    const wrap = document.getElementById('wrap_' + id);
    const sym  = document.getElementById('sym_' + id);
    if (!wrap) return;

    wrap.classList.remove('is-locked', 'is-calc');
    if (sym) sym.classList.remove('is-calc-sym', 'is-locked-sym');

    if (locked.has(id)) {
      wrap.classList.add('is-locked');
      if (sym) sym.classList.add('is-locked-sym');
    } else if (calcSet.has(id) && !userSet.has(id)) {
      wrap.classList.add('is-calc');
      if (sym) sym.classList.add('is-calc-sym');
    }
  }

  function toggleLock(field) {
    const btn = document.getElementById('lock_' + field);
    if (locked.has(field)) {
      locked.delete(field);
      btn.textContent = '🔓';
      btn.classList.remove('is-locked');
    } else {
      locked.add(field);
      btn.textContent = '🔒';
      btn.classList.add('is-locked');
    }
    updateWrapStyle(field);
  }

  function clearField(id) {
    document.getElementById(id).value = '';
    userSet.delete(id);
    calcSet.delete(id);
    locked.delete(id);
    const i = userOrder.indexOf(id);
    if (i !== -1) userOrder.splice(i, 1);
    delete calcSource[id];
    setFieldError(id, false);
    document.getElementById('lock_' + id).textContent = '🔓';
    document.getElementById('lock_' + id).classList.remove('is-locked');
    updateWrapStyle(id);
    recalcAll();
    updateClearBtn();
  }

  let focusedField = null;
  const userOrder = []; // tracks order fields were user-entered, oldest first
  const calcSource = {}; // maps calculated field → the user field that triggered its calculation

  function onUserInput(id) {
    const el = document.getElementById(id);

    // Enforce 9-digit cap on text (dollar) fields
    if (dollarFields.has(id)) {
      const digits = el.value.replace(/[^0-9]/g, '');
      if (digits.length > 9) {
        const n = parseVal(el.value);
        if (n !== null) {
          const s = String(Math.trunc(n));
          if (s.length > 9) { el.value = el.value.slice(0, el.value.length - 1); }
        }
      }
    }

    if (el.value === '' || el.value === '-') {
      userSet.add(id);
      calcSet.delete(id);
    } else {
      // Move this field to end of order list (most recent)
      const pos = userOrder.indexOf(id);
      if (pos !== -1) userOrder.splice(pos, 1);
      userOrder.push(id);

      userSet.add(id);
      calcSet.delete(id);

      // Field groups — if all 3 in a group are known (user or locked), evict the OLDEST user-set non-locked non-current one
      const vcGroup = currentMode === 'direct'
        ? ['vendorCost', 'vendorMargin', 'resellerPrice']
        : ['vendorCost', 'vendorMargin', 'distyPrice'];
      const dpGroup = ['distyPrice', 'distyMargin', 'resellerPrice'];
      const groups = currentMode === 'direct' ? [vcGroup] : [vcGroup, dpGroup];

      groups.forEach(group => {
        const allKnown = group.every(f => userSet.has(f) || locked.has(f));
        if (!allKnown) return;
        const evictable = group.filter(f => userSet.has(f) && !locked.has(f) && f !== id);
        if (evictable.length === 0) return;
        for (let i = 0; i < userOrder.length; i++) {
          const f = userOrder[i];
          if (evictable.includes(f)) {
            userSet.delete(f);
            calcSet.delete(f);
            userOrder.splice(i, 1);
            break;
          }
        }
      });

      // If user is overriding a currently-calculated (yellow) field and no group eviction fired, release its source
      if (calcSet.has(id) && calcSource[id]) {
        const src = calcSource[id];
        if (!locked.has(src) && userSet.has(src)) {
          userSet.delete(src);
          calcSet.delete(src);
          const si = userOrder.indexOf(src);
          if (si !== -1) userOrder.splice(si, 1);
        }
        delete calcSource[id];
      }
    }

    updateWrapStyle(id);
    recalcAll();
    updateClearBtn();
  }

  function recalcAll() {
    const allFields = currentMode === 'direct'
      ? ['vendorCost','vendorMargin','resellerPrice']
      : ['vendorCost','vendorMargin','distyPrice','distyMargin','resellerPrice'];

    // Reset only non-user, non-locked, non-focused fields
    allFields.forEach(id => {
      if (!userSet.has(id) && !locked.has(id) && id !== focusedField) {
        calcSet.delete(id);
        document.getElementById(id).value = '';
        updateWrapStyle(id);
      }
    });

    function canWrite(id) { return !userSet.has(id) && !locked.has(id); }

    // Evict a stale user-set field so it can recalculate (skip if focused or locked)
    function evict(id) {
      if (!userSet.has(id) || locked.has(id) || focusedField === id) return false;
      userSet.delete(id); calcSet.delete(id);
      document.getElementById(id).value = '';
      updateWrapStyle(id);
      return true;
    }

    // Is a field stale vs expected value?
    function stale(id, expected) {
      const v = val(id);
      return v !== null && isFinite(expected) && Math.abs(v - expected) > TOLERANCE;
    }

    // Run 4 passes so forward+backward chains fully resolve
    for (let pass = 0; pass < 4; pass++) {
      if (currentMode === 'direct') {
        const vc = val('vendorCost'), vm = val('vendorMargin'), rp = val('resellerPrice');

        // Calculate
        const vc2=val('vendorCost'), vm2=val('vendorMargin'), rp2=val('resellerPrice');
        if (canWrite('vendorMargin') && vc2!==null && rp2!==null && rp2!==0) setCalc('vendorMargin',(1-vc2/rp2)*100);
        if (canWrite('vendorCost') && val('vendorMargin')!==null && val('vendorMargin')<100 && rp2!==null) setCalc('vendorCost',rp2*(1-val('vendorMargin')/100));
        if (canWrite('resellerPrice') && vc2!==null && val('vendorMargin')!==null && val('vendorMargin')<100) setCalc('resellerPrice',vc2/(1-val('vendorMargin')/100));

      } else {
        const vc=val('vendorCost'), vm=val('vendorMargin');
        const dp=val('distyPrice'), dm=val('distyMargin'), rp=val('resellerPrice');

        // Forward: vendor group
        const vc2=val('vendorCost'), vm2=val('vendorMargin'), dp2r=val('distyPrice');
        if (canWrite('distyPrice') && vc2!==null && vm2!==null && vm2<100) setCalc('distyPrice',vc2/(1-vm2/100));
        if (canWrite('vendorMargin') && vc2!==null && val('distyPrice')!==null && val('distyPrice')!==0) setCalc('vendorMargin',(1-vc2/val('distyPrice'))*100);
        if (canWrite('vendorCost') && val('vendorMargin')!==null && val('vendorMargin')<100 && val('distyPrice')!==null) setCalc('vendorCost',val('distyPrice')*(1-val('vendorMargin')/100));

        // Forward: disty group
        const dp2=val('distyPrice'), dm2=val('distyMargin'), rp2=val('resellerPrice');
        if (canWrite('resellerPrice') && dp2!==null && dm2!==null && dm2<100) setCalc('resellerPrice',dp2/(1-dm2/100));
        if (canWrite('distyMargin') && dp2!==null && rp2!==null && rp2!==0) setCalc('distyMargin',(1-dp2/rp2)*100);

        // Backward: resolve dp from rp+dm, then cascade up
        if (canWrite('distyPrice') && val('distyMargin')!==null && val('distyMargin')<100 && val('resellerPrice')!==null)
          setCalc('distyPrice', val('resellerPrice')*(1-val('distyMargin')/100));
        if (canWrite('vendorCost') && val('vendorMargin')!==null && val('vendorMargin')<100 && val('distyPrice')!==null)
          setCalc('vendorCost', val('distyPrice')*(1-val('vendorMargin')/100));
        if (canWrite('vendorMargin') && val('vendorCost')!==null && val('distyPrice')!==null && val('distyPrice')!==0)
          setCalc('vendorMargin', (1-val('vendorCost')/val('distyPrice'))*100);
      }
    }

    // Profits (outside loop, final values)
    const vcf=val('vendorCost'), dpf=val('distyPrice'), rpf=val('resellerPrice');
    if (currentMode==='direct') { if (vcf!==null && rpf!==null) setCalc('vendorProfit', rpf-vcf); }
    else { if (vcf!==null && dpf!==null) setCalc('vendorProfit', dpf-vcf); }

    validateFields();
  }

    const TOLERANCE = 0.02; // allow 2 cents rounding tolerance

  function validateFields() {
    const allFields = ['vendorCost','vendorMargin','distyPrice','distyMargin','resellerPrice'];
    // Clear all error states first
    allFields.forEach(id => setFieldError(id, false));

    const vc = val('vendorCost');
    const vm = val('vendorMargin');
    const dp = currentMode === 'direct' ? null : val('distyPrice');
    const dm = currentMode === 'direct' ? null : val('distyMargin');
    const rp = val('resellerPrice');

    if (currentMode === 'direct') {
      // Check: vc, vm, rp are all present and consistent
      if (vc !== null && vm !== null && rp !== null) {
        const expectedRp = vc / (1 - vm / 100);
        if (Math.abs(expectedRp - rp) > TOLERANCE) {
          // Find which field was most recently entered — that's the anchor, flag the others
          flagInconsistent(['vendorCost','vendorMargin','resellerPrice']);
        }
      }
    } else {
      // Vendor group: vc, vm, dp
      if (vc !== null && vm !== null && dp !== null) {
        const expectedDp = vc / (1 - vm / 100);
        if (Math.abs(expectedDp - dp) > TOLERANCE) {
          flagInconsistent(['vendorCost','vendorMargin','distyPrice']);
        }
      }
      // Disty group: dp, dm, rp
      if (dp !== null && dm !== null && rp !== null) {
        const expectedRp = dp / (1 - dm / 100);
        if (Math.abs(expectedRp - rp) > TOLERANCE) {
          flagInconsistent(['distyPrice','distyMargin','resellerPrice']);
        }
      }
    }
  }

  function flagInconsistent(group) {
    // Never flag if a locked field is in the group AND there's a free field to recalc into
    // Only flag when all three are user-set (no locked, no calc) and they disagree
    if (group.some(id => locked.has(id))) return;
    if (group.some(id => calcSet.has(id) && !userSet.has(id))) return;
    const allUserEntered = group.every(id => userSet.has(id));
    if (!allUserEntered) return;
    group.forEach(id => {
      if (userSet.has(id)) setFieldError(id, true);
    });
  }

  function setFieldError(id, isError) {
    const wrap = document.getElementById('wrap_' + id);
    const btn = wrap ? wrap.parentElement.querySelector('.clear-btn') : null;
    // Find the clear button for this field
    const row = document.getElementById('wrap_' + id)?.closest('.row');
    const clearBtn = row ? row.querySelector('.clear-btn') : null;
    if (!wrap) return;
    if (isError) {
      wrap.classList.add('is-error');
      if (clearBtn) {
        clearBtn.classList.add('is-error');
        clearBtn.textContent = '↺';
        clearBtn.title = 'Math error — click to reset field';
      }
    } else {
      wrap.classList.remove('is-error');
      if (clearBtn) {
        clearBtn.classList.remove('is-error');
        clearBtn.textContent = '×';
        clearBtn.title = 'Clear';
      }
    }
  }

  function copyResult() {
    const allFields = [
      { label: 'Vendor Cost',    id: 'vendorCost',    prefix: '$' },
      { label: 'Vendor Margin',  id: 'vendorMargin',  suffix: '%' },
      { label: 'Disty Price',    id: 'distyPrice',    prefix: '$' },
      { label: 'Disty Margin',   id: 'distyMargin',   suffix: '%' },
      { label: 'Reseller Price', id: 'resellerPrice', prefix: '$' },
      { label: 'Vendor Profit',  id: 'vendorProfit',  prefix: '$' },
    ];
    const directOnly = new Set(['distyPrice','distyMargin']);
    const fields = currentMode === 'direct'
      ? allFields.filter(f => !directOnly.has(f.id))
      : allFields;
    const lines = fields
      .filter(f => val(f.id) !== null)
      .map(f => {
        const n = val(f.id);
        const formatted = f.prefix ? fmtDollar(n) : n.toFixed(2);
        return `${f.label}: ${f.prefix||''}${formatted}${f.suffix||''}`;
      });
    navigator.clipboard.writeText(lines.join('\n')).then(() => showToast('Copied!'));
  }

  function clearAll() {
    const allFields = ['vendorCost','vendorMargin','distyPrice','distyMargin','resellerPrice'];
    allFields.forEach(id => {
      const el = document.getElementById(id);
      const lock = document.getElementById('lock_' + id);
      if (el) el.value = '';
      locked.delete(id);
      userSet.delete(id);
      calcSet.delete(id);
      if (lock) { lock.textContent = '🔓'; lock.classList.remove('is-locked'); }
      updateWrapStyle(id);
    });
    // Also clear the read-only vendor profit display
    const vp = document.getElementById('vendorProfit');
    if (vp) vp.value = '';
    updateWrapStyle('vendorProfit');
    userOrder.length = 0;
    Object.keys(calcSource).forEach(k => delete calcSource[k]);
    updateClearBtn();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }
</script>
